# Builds the site's own image from ./Dockerfile (pinned Ruby + Gemfile.lock).
# Usage: docker compose up -d   ->  http://localhost:8080
services:
  jekyll:
    image: rrgaire-site:local
    build: .
    pull_policy: build # always (re)build from the Dockerfile; cached, so fast after the first time
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
